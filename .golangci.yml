version: "2"
run:
  modules-download-mode: readonly
linters:
  default: none
  enable:
    - asciicheck
    - bodyclose
    - depguard
    - dogsled
    - dupl
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goheader
    - gomodguard_v2
    - goprintffuncname
    - gosec
    - govet
    - ineffassign
    - lll
    - makezero
    - misspell
    - nakedret
    - nolintlint
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        main:
          allow:
            - $gostd
            - github.com/blindsidenetworks/mattermost-plugin-bigbluebutton
            - github.com/mattermost/mattermost/server/public
            - github.com/segmentio/ksuid
            - github.com/thoas/go-funk
    govet:
      disable:
        - fieldalignment
      enable-all: true
    lll:
      line-length: 150
    revive:
      # The old enableAllRules key was invalid. Keep the default rules rather
      # than enabling hundreds of new style checks in this dependency upgrade.
      enable-all-rules: false
      rules:
        - name: exported
          disabled: true
        # The legacy BBB wrapper uses protocol-derived names with underscores.
        - name: var-naming
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
